name: Validate SysML

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SPEC42_VERSION: "0.54.1"
  # Elan8 libraries the model is validated against, pinned to exact commits.
  DOMAIN_LIBRARIES_REF: bb2aba9d356314ffb38510ed8f87a556503736ab

jobs:
  spec42:
    name: Spec42
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Elan8 domain libraries
        uses: actions/checkout@v4
        with:
          repository: elan8/sysml-domain-libraries
          ref: ${{ env.DOMAIN_LIBRARIES_REF }}
          path: .libraries/sysml-domain-libraries

      - name: Check lean-model invariants
        shell: pwsh
        run: ./scripts/check-model-guards.ps1

      - name: Install Spec42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/spec42"
          gh release download "v$SPEC42_VERSION" --repo elan8/spec42 \
            --pattern "spec42-$SPEC42_VERSION-linux-x64.tar.gz" --dir "$RUNNER_TEMP/spec42"
          tar -xzf "$RUNNER_TEMP/spec42/spec42-$SPEC42_VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/spec42"
          echo "$RUNNER_TEMP/spec42" >> "$GITHUB_PATH"

      # The libraries bundled with Spec42 are disabled so that only the pinned
      # sources above are used. Errors and warnings fail; document container views
      # may report view_expose_empty information because they compose sections.
      - name: Validate model
        run: |
          spec42 --disable-kpar-library domain --disable-kpar-library method \
            --library-path .libraries/sysml-domain-libraries/model \
            --library-path libraries/doc42-v0.4.0 \
            check model --warnings-as-errors | tee spec42.txt
          grep -q "0 error(s), 0 warning(s)," spec42.txt
          # Only the document containers' empty-expose information is expected.
          if grep 'info \[' spec42.txt | grep -v 'Documents.sysml:.*info \[view_expose_empty\]'; then
            exit 1
          fi

      # The bill of materials and the mass budget are derived from the model.
      # This fails when they are stale or when the model has a gap.
      - name: Check generated document data
        env:
          SYSML_DOMAIN_LIBRARIES_ROOT: .libraries/sysml-domain-libraries
        run: python3 scripts/generate-document-data.py --check

  documents:
    name: Doc42 documents
    runs-on: ubuntu-latest
    needs: spec42
    # Generating documents needs the Elan8 license secret, which pull requests
    # from forks do not receive.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Elan8 domain libraries
        uses: actions/checkout@v4
        with:
          repository: elan8/sysml-domain-libraries
          ref: ${{ env.DOMAIN_LIBRARIES_REF }}
          path: .libraries/sysml-domain-libraries

      # Doc42 reads every model file under the repository, so the libraries
      # are moved outside it and passed as library paths instead.
      - name: Move libraries out of the workspace
        run: mv .libraries "$RUNNER_TEMP/libraries"

      - name: Install Doc42
        uses: elan8/doc42-action@v0.4.0

      - name: Check documents
        run: |
          doc42 check model --workspace-root . \
            --library-path "$RUNNER_TEMP/libraries/sysml-domain-libraries/model"

      - name: Build documents
        env:
          ELAN8_LICENSE: ${{ secrets.ELAN8_LICENSE }}
        run: |
          for document in crs srs sds vvp; do
            doc42 build model --workspace-root . --doc "RobotDocuments::$document" --out out \
                --library-path "$RUNNER_TEMP/libraries/sysml-domain-libraries/model"
          done

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: engineering-documents
          path: |
            out/*.pdf
            documents/generated/bom.csv
          if-no-files-found: error
