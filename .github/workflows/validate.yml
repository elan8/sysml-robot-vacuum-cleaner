name: Validate SysML

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SPEC42_VERSION: "0.54.1"
  # Elan8 libraries the model is validated against, pinned to exact commits.
  DOMAIN_LIBRARIES_REF: 24f13ae144a0400609d33ec93b1e476269235c97

jobs:
  spec42:
    name: Spec42
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Elan8 domain libraries
        uses: actions/checkout@v4
        with:
          repository: elan8/sysml-domain-libraries
          ref: ${{ env.DOMAIN_LIBRARIES_REF }}
          path: .libraries/sysml-domain-libraries

      - name: Check lean-model invariants
        shell: pwsh
        run: ./scripts/check-model-guards.ps1

      - name: Install Spec42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/spec42"
          gh release download "v$SPEC42_VERSION" --repo elan8/spec42 \
            --pattern "spec42-$SPEC42_VERSION-linux-x64.tar.gz" --dir "$RUNNER_TEMP/spec42"
          tar -xzf "$RUNNER_TEMP/spec42/spec42-$SPEC42_VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/spec42"
          echo "$RUNNER_TEMP/spec42" >> "$GITHUB_PATH"

      # The libraries bundled with Spec42 are disabled so that only the pinned
      # sources above are used. Errors and warnings fail; document container views
      # may report view_expose_empty information because they compose sections.
      - name: Validate model
        run: |
          spec42 --disable-kpar-library domain --disable-kpar-library method \
            --library-path .libraries/sysml-domain-libraries/model \
            check model --warnings-as-errors | tee spec42.txt
          grep -q "0 error(s), 0 warning(s)," spec42.txt
          # Only the document containers' empty-expose information is expected.
          if grep 'info \[' spec42.txt | grep -v 'Documents.sysml:.*info \[view_expose_empty\]'; then
            exit 1
          fi

      # The bill of materials and the mass budget are derived from the model.
      # Generate them on every run; a model gap fails the job.
      - name: Check model traceability and mass budget
        env:
          SYSML_DOMAIN_LIBRARIES_ROOT: .libraries/sysml-domain-libraries
        run: python3 scripts/generate-document-data.py
