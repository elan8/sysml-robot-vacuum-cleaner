name: Validate SysML

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SPEC42_VERSION: "0.57.0"
  # Elan8 libraries the model is validated against, pinned to exact commits.
  DOMAIN_LIBRARIES_REF: 1f277cacf8c8fefc8710169e9764c6812f9be57e # v0.5.0
  METHODOLOGY_REF: 0cb3ee0e7b5e64cf4f850a46da5f26acb280a4c2

jobs:
  spec42:
    name: Spec42
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Elan8 domain libraries
        uses: actions/checkout@v4
        with:
          repository: elan8/sysml-domain-libraries
          ref: ${{ env.DOMAIN_LIBRARIES_REF }}
          path: .libraries/sysml-domain-libraries

      - name: Check lean-model invariants
        shell: pwsh
        run: ./scripts/check-model-guards.ps1

      - name: Checkout MBSE methodology checker
        uses: actions/checkout@v4
        with:
          repository: elan8/mbse-methodology
          ref: ${{ env.METHODOLOGY_REF }}
          path: .libraries/mbse-methodology

      - name: Install Spec42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/spec42"
          gh release download "v$SPEC42_VERSION" --repo elan8/spec42 \
            --pattern "spec42-$SPEC42_VERSION-linux-x64.tar.gz" --dir "$RUNNER_TEMP/spec42"
          tar -xzf "$RUNNER_TEMP/spec42/spec42-$SPEC42_VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/spec42"
          echo "$RUNNER_TEMP/spec42" >> "$GITHUB_PATH"

      # Validate the same pinned dependencies and diagnostic policy locally and
      # in CI. Only four documented custom-view warnings are accepted; see
      # docs/VALIDATION.md. The structural checker receives dependency semantics.
      - name: Validate model
        run: python3 scripts/validate_model.py

      - name: Check diagnostic and procurement export policies
        run: python3 -m unittest discover -s tests

      # The bill of materials and the mass budget are derived from the model.
      # Generate them on every run; a model gap fails the job.
      - name: Check model traceability and mass budget
        env:
          SYSML_DOMAIN_LIBRARIES_ROOT: .libraries/sysml-domain-libraries
        run: python3 scripts/generate-document-data.py
