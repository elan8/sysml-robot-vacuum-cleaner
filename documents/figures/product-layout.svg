  <rect x="140" y="272" width="120" height="66" rx="10" fill="#e8ecf0" stroke="#4b5563" stroke-width="1.4"/>
  <g fill="#b91c1c">
    <rect x="103" y="103" width="11" height="11"/><rect x="286" y="103" width="11" height="11"/>
    <rect x="88" y="296" width="11" height="11"/><rect x="301" y="296" width="11" height="11"/>
  </g>
  <g fill="#1d4ed8">
    <rect x="194" y="68" width="12" height="8"/><rect x="58" y="166" width="8" height="12"/><rect x="334" y="166" width="8" height="12"/>
  </g>
  <path d="M 200 40 v 16 m -6 -8 l 6 -8 l 6 8" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="212" y="50" font-size="9.9" fill="#6b7280">forward</text>

