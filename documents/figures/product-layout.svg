<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.7" fill="#1f2933">
  <!-- Authored figure. Dimensions follow DesignLimits and ModuleBudgets; update by hand when they change. -->
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="20" y="26" font-size="13.5" font-weight="bold">Top view (shell removed)</text>
  <text x="400" y="26" font-size="13.5" font-weight="bold">Side view</text>

  <!-- top view, scale 0.88 px per mm, front is up -->
