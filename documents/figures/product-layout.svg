  <text x="200" y="404" text-anchor="middle" font-size="10.8" fill="#4b5563">⌀ 340 mm (nominal)</text>

  <!-- side view, same scale, floor at y = 150 -->
  <path d="M 400 150 h 330" stroke="#1f2933" stroke-width="1.2"/>
  <path d="M 400 154 h 330" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 4"/>
