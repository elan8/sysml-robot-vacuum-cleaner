    <path d="M 718 68 h 24 M 718 150 h 24 M 736 68 v 82"/>
    <path d="M 404 68 h 16 M 404 100 h 16 M 404 150 h 16 M 412 68 v 82"/>
  </g>
  <g font-size="10.8" fill="#4b5563">
    <text x="744" y="58" text-anchor="end">95 mm max (SYS-011)</text>
    <text x="400" y="58">top 38 mm (TOP-001)</text>
    <text x="400" y="172">base 57 mm (BASE-004)</text>
    <text x="600" y="172" fill="#b45309">parting line</text>
  </g>

  <!-- legend -->
  <g font-size="11.2">
    <text x="400" y="212"><tspan font-weight="bold">1</tspan>  360° laser distance scanner</text>
    <text x="400" y="232"><tspan font-weight="bold">2</tspan>  Front bumper with switch</text>
    <text x="400" y="252"><tspan font-weight="bold">3</tspan>  Time-of-flight sensors (3×, blue)</text>
    <text x="400" y="272"><tspan font-weight="bold">4</tspan>  Cliff sensors (4×, red)</text>
    <text x="400" y="292"><tspan font-weight="bold">5</tspan>  Drive trains with wheel-drop switch (2×)</text>
    <text x="400" y="312"><tspan font-weight="bold">6</tspan>  Front caster wheel</text>
    <text x="400" y="332"><tspan font-weight="bold">7</tspan>  Cleaning head: main brush and suction duct</text>
    <text x="400" y="352"><tspan font-weight="bold">8</tspan>  Main control board (above the chassis)</text>
    <text x="400" y="372"><tspan font-weight="bold">9</tspan>  Power module with 14.4 V battery pack</text>
    <text x="400" y="392"><tspan font-weight="bold">10</tspan>  Removable dust bin with filter</text>
  </g>
</svg>
