    <g><circle cx="96" cy="130" r="9" fill="#1f2933"/><text x="96" y="134">2</text></g>
    <g><circle cx="224" cy="72" r="9" fill="#1f2933"/><text x="224" y="76">3</text></g>
    <g><circle cx="126" cy="108" r="9" fill="#1f2933"/><text x="126" y="112">4</text></g>
    <g><circle cx="72" cy="262" r="9" fill="#1f2933"/><text x="72" y="266">5</text></g>
    <g><circle cx="222" cy="100" r="9" fill="#1f2933"/><text x="222" y="104">6</text></g>
    <g><circle cx="200" cy="151" r="9" fill="#1f2933"/><text x="200" y="155">7</text></g>
    <g><circle cx="140" cy="240" r="9" fill="#1f2933"/><text x="140" y="244">8</text></g>
