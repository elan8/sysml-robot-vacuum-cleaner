<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.7" fill="#1f2933" role="img" aria-labelledby="title desc">
  <title id="title">Robot layout: two forward side brushes and rear caster</title>
  <desc id="desc">Plan view with shell removed and underside components shown, plus left side elevation. Forward is up in plan and left in elevation. Two side brushes sweep into the main roller and suction intake; the caster is behind both. Nominal body diameter 340 mm, drive wheels 65 mm, design height 92 mm within a 95 mm limit.</desc>
  <!-- Authored figure. Scale 0.88 px/mm. Coordinates follow PhysicalArchitecture:
       origin at drive axle; +longitudinal forward, +lateral left.
       Main roller +75 mm; intake +55 mm; side brushes +100 mm / +/-125 mm;
       rear caster -140 mm. Base 55 mm; top 37 mm; drive wheel diameter 65 mm. -->
  <rect width="840" height="540" fill="#ffffff"/>
  <text x="20" y="26" font-size="13.5" font-weight="bold">Plan view (shell removed)</text>
  <text x="20" y="44" font-size="10.8" fill="#4b5563">Underside cleaning parts shown through the chassis</text>
  <text x="435" y="26" font-size="13.5" font-weight="bold">Left side elevation</text>
  <text x="435" y="47" font-size="10.8" fill="#4b5563">92 mm design; 95 mm maximum (SYS-011)</text>
  <defs>
    <g id="side-brush" stroke="#b45309" stroke-width="3" stroke-linecap="round">
      <path d="M 0 0 L -27 -23 M 0 0 L 33 -12 M 0 0 L -6 35"/>
      <circle r="35.2" fill="none" stroke-width="0.8" stroke-dasharray="3 3"/>
      <circle r="6" fill="#fdf1e2" stroke-width="1.3"/>
    </g>
  </defs>
  <!-- Plan, origin (200,230); front up. -->
  <circle cx="200" cy="230" r="149.6" fill="#f3f6f8" stroke="#1f2933" stroke-width="1.6"/>
  <path d="M 62 175 A 149.6 149.6 0 0 1 338 175" fill="none" stroke="#0891b2" stroke-width="7" stroke-linecap="round"/>
  <use href="#side-brush" transform="translate(90 142)"/>
  <use href="#side-brush" transform="translate(310 142) scale(-1 1)"/>
  <!-- Main roller at +75 mm; intake at +55 mm. -->
  <rect x="128" y="153" width="144" height="38" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="1.4"/>
  <path d="M 140 164 h 120" stroke="#0891b2" stroke-width="3" stroke-dasharray="5 3"/>
  <path d="M 144 181.6 h 112" stroke="#1f2933" stroke-width="3"/>
  <rect x="62" y="201.4" width="20" height="57.2" rx="5" fill="#4b5563"/>
  <rect x="318" y="201.4" width="20" height="57.2" rx="5" fill="#4b5563"/>
  <rect x="98" y="201" width="84" height="58" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.3" stroke-dasharray="5 3"/>
  <rect x="218" y="201" width="84" height="58" rx="4" fill="#fdf1e2" stroke="#b45309" stroke-width="1.3"/>
  <circle cx="200" cy="230" r="30" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
  <circle cx="200" cy="230" r="5" fill="#1f2933"/>
  <rect x="140" y="275" width="120" height="50" rx="10" fill="#e8ecf0" stroke="#4b5563" stroke-width="1.4"/>
  <circle cx="200" cy="353.2" r="11" fill="#ffffff" stroke="#4b5563" stroke-width="1.6"/>
  <g fill="#b91c1c">
    <rect x="142" y="99" width="11" height="11"/><rect x="247" y="99" width="11" height="11"/>
    <rect x="98" y="311" width="11" height="11"/><rect x="291" y="311" width="11" height="11"/>
  </g>
  <g fill="#1d4ed8">
    <rect x="194" y="83" width="12" height="8"/><rect x="58" y="181" width="8" height="12"/><rect x="334" y="181" width="8" height="12"/>
  </g>
  <path d="M 200 54 v 17 m -6 -9 l 6 -8 l 6 8" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="213" y="65" font-size="10.8" fill="#4b5563">forward</text>
  <!-- Callouts refer to the legend, not part positions. -->
  <g font-size="9.9" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <g><circle cx="200" cy="211" r="9" fill="#1f2933"/><text x="200" y="215">1</text></g>
    <g><circle cx="112" cy="112" r="9" fill="#1f2933"/><text x="112" y="116">2</text></g>
    <g><circle cx="224" cy="87" r="9" fill="#1f2933"/><text x="224" y="91">3</text></g>
    <g><circle cx="167" cy="104" r="9" fill="#1f2933"/><text x="167" y="108">4</text></g>
    <g><circle cx="72" cy="275" r="9" fill="#1f2933"/><text x="72" y="279">5</text></g>
    <g><circle cx="222" cy="354" r="9" fill="#1f2933"/><text x="222" y="358">6</text></g>
    <g><circle cx="200" cy="163" r="9" fill="#1f2933"/><text x="200" y="167">7</text></g>
    <g><circle cx="140" cy="245" r="9" fill="#1f2933"/><text x="140" y="249">8</text></g>
    <g><circle cx="260" cy="245" r="9" fill="#1f2933"/><text x="260" y="249">9</text></g>
    <g><circle cx="200" cy="300" r="9" fill="#1f2933"/><text x="200" y="304">10</text></g>
    <g><circle cx="76" cy="157" r="9" fill="#1f2933"/><text x="76" y="161">11</text></g>
    <g><circle cx="324" cy="157" r="9" fill="#1f2933"/><text x="324" y="161">11</text></g>
  </g>
  <path d="M 50.4 412 h 299.2 M 50.4 406 v 12 M 349.6 406 v 12" stroke="#6b7280"/>
  <text x="200" y="435" text-anchor="middle" font-size="10.8" fill="#4b5563">Body diameter 340 mm (nominal)</text>
  <text x="20" y="469" font-size="10.8" fill="#4b5563">Dashed brush circles: 80 mm swept diameter.</text>
  <text x="20" y="487" font-size="10.8" fill="#4b5563">Both side brushes sweep inward to the cleaning head.</text>
  <text x="20" y="505" font-size="10.8" fill="#4b5563">Rear caster trails the main roller and suction intake.</text>

  <!-- Elevation, origin x=600 at drive axle; front left; floor y=190. -->
  <path d="M 430 190 h 350" stroke="#1f2933" stroke-width="1.2"/>
  <rect x="450.4" y="141.6" width="299.2" height="41.4" rx="6" fill="#f3f6f8" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="450.4" y="131.04" width="299.2" height="10.56" rx="5" fill="#e8ecf0" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="450.4" y="134" width="10" height="43" rx="5" fill="#0891b2"/>
  <rect x="572" y="109.04" width="56" height="22" rx="4" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <circle cx="600" cy="161.4" r="28.6" fill="#4b5563"/>
  <circle cx="600" cy="161.4" r="7" fill="#9ca3af"/>
  <circle cx="723.2" cy="182.08" r="7.92" fill="#ffffff" stroke="#4b5563" stroke-width="1.4"/>
  <circle cx="534" cy="181" r="9" fill="#cffafe" stroke="#0891b2" stroke-width="1.4"/>
  <path d="M 549 185 h 6" stroke="#1f2933" stroke-width="3"/>
  <path d="M 476.8 188 h 70.4" stroke="#b45309" stroke-width="2"/>
  <path d="M 450.4 141.6 h 299.2" stroke="#b45309" stroke-width="1" stroke-dasharray="6 3"/>
  <path d="M 482 87 h -32 l 7 -5 m -7 5 l 7 5" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="490" y="91" font-size="10.8" fill="#4b5563">forward</text>
  <g stroke="#6b7280" stroke-width="1" fill="none">
    <path d="M 777 106.4 h 22 M 777 190 h 22 M 793 106.4 v 83.6"/>
    <path d="M 754 109.04 h 20 M 754 141.6 h 20 M 754 190 h 20 M 767 109.04 v 80.96"/>
  </g>
  <g font-size="10.8" fill="#4b5563">
    <text x="435" y="216">Drive wheels: 65 mm diameter</text>
    <text x="435" y="236">Top: 37 mm design / 38 mm budget (TOP-001)</text>
    <text x="435" y="254">Base: 55 mm design / 57 mm budget (BASE-004)</text>
    <text x="435" y="272" fill="#b45309">Dashed horizontal line: module parting line</text>
  </g>
  <!-- Legend -->
  <g font-size="11.2">
    <text x="435" y="300"><tspan font-weight="bold">1</tspan>  360° laser distance scanner</text>
    <text x="435" y="321"><tspan font-weight="bold">2</tspan>  Front bumper with switch</text>
    <text x="435" y="342"><tspan font-weight="bold">3</tspan>  Time-of-flight sensors (3×, blue)</text>
    <text x="435" y="363"><tspan font-weight="bold">4</tspan>  Cliff sensors (4×, red)</text>
    <text x="435" y="384"><tspan font-weight="bold">5</tspan>  Drive trains with wheel-drop switch (2×)</text>
    <text x="435" y="405"><tspan font-weight="bold">6</tspan>  Rear caster wheel</text>
    <text x="435" y="426"><tspan font-weight="bold">7</tspan>  Main roller and suction intake</text>
    <text x="435" y="447"><tspan font-weight="bold">8</tspan>  Main control board (above chassis)</text>
    <text x="435" y="468"><tspan font-weight="bold">9</tspan>  Power module with 14.4 V battery pack</text>
    <text x="435" y="489"><tspan font-weight="bold">10</tspan>  Removable dust bin with filter</text>
    <text x="435" y="510"><tspan font-weight="bold">11</tspan>  Side brushes (2×, shared mechanical drive)</text>
  </g>
</svg>
