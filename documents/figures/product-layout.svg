  <path d="M 140 151 h 120" stroke="#0891b2" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="98" y="178" width="84" height="74" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.3" stroke-dasharray="5 3"/>
  <rect x="218" y="178" width="84" height="74" rx="4" fill="#fdf1e2" stroke="#b45309" stroke-width="1.3"/>
