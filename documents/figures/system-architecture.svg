<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.8" fill="#1f2933">
  <!-- Authored figure. Blocks are the parts of PhysicalArchitecture; update by hand when the architecture changes. -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4b5563"/></marker>
    <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b45309"/></marker>
    <marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>

  <!-- module frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4">
    <rect x="14" y="14" width="212" height="182" rx="6"/>
    <rect x="14" y="210" width="212" height="186" rx="6"/>
    <rect x="250" y="14" width="260" height="290" rx="6"/>
    <rect x="250" y="322" width="496" height="164" rx="6"/>
    <rect x="534" y="14" width="212" height="290" rx="6"/>
  </g>
  <g font-size="10.3" fill="#6b7280" font-style="italic">
    <text x="22" y="30">Top module</text>
    <text x="22" y="226">Base module: sensing</text>
    <text x="258" y="30">Main control board</text>
    <text x="258" y="338">Base module: power module and dock interface</text>
    <text x="542" y="30">Base module: actuation</text>
  </g>

  <g stroke="#1f2933" stroke-width="1.3" fill="#f3f6f8">
    <!-- top module -->
    <rect x="28" y="40" width="184" height="30" rx="4"/><rect x="28" y="78" width="184" height="30" rx="4"/>
    <rect x="28" y="116" width="184" height="30" rx="4"/><rect x="28" y="154" width="184" height="30" rx="4"/>
    <!-- base sensing -->
    <rect x="28" y="238" width="184" height="30" rx="4"/><rect x="28" y="276" width="184" height="30" rx="4"/>
    <rect x="28" y="314" width="184" height="30" rx="4"/><rect x="28" y="352" width="184" height="30" rx="4"/>
    <!-- actuation -->
    <rect x="548" y="52" width="184" height="30" rx="4"/><rect x="548" y="96" width="184" height="30" rx="4"/>
    <rect x="548" y="156" width="184" height="30" rx="4"/><rect x="548" y="194" width="184" height="30" rx="4"/>
    <rect x="548" y="246" width="184" height="30" rx="4"/>
    <!-- board -->
    <rect x="388" y="52" width="108" height="30" rx="4"/><rect x="388" y="96" width="108" height="30" rx="4"/>
    <rect x="264" y="250" width="108" height="34" rx="4"/><rect x="388" y="250" width="108" height="34" rx="4"/>
  </g>
  <rect x="264" y="44" width="108" height="190" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/>
  <g stroke="#b45309" stroke-width="1.3" fill="#fdf1e2">
    <rect x="264" y="350" width="104" height="34" rx="4"/><rect x="388" y="350" width="104" height="34" rx="4"/>
    <rect x="512" y="350" width="104" height="34" rx="4"/><rect x="636" y="350" width="98" height="34" rx="4"/>
    <rect x="512" y="410" width="104" height="30" rx="4"/><rect x="636" y="410" width="98" height="30" rx="4"/>
  </g>

  <g text-anchor="middle">
    <text x="120" y="59">Laser distance scanner</text><text x="120" y="97">Time-of-flight sensors (3×)</text>
    <text x="120" y="135">Bumper switch</text><text x="120" y="173">Buttons and indicators</text>
    <text x="120" y="257">Cliff sensors (4×)</text><text x="120" y="295">Wheel-drop switches (2×)</text>
    <text x="120" y="333">Wheel encoders (2×)</text><text x="120" y="371">Homing-beacon receiver</text>
    <text x="640" y="71">Drive motor, left</text><text x="640" y="115">Drive motor, right</text>
    <text x="640" y="175">Brush driver + motor (3 brushes)</text><text x="640" y="213">H-bridge and fan motor</text>
    <text x="640" y="265">Gearboxes and drive wheels</text>
    <text x="442" y="71">3-phase driver</text><text x="442" y="115">3-phase driver</text>
    <text x="318" y="271">Inertial unit</text><text x="442" y="271">Wi-Fi and BLE</text>
    <text x="318" y="92" font-weight="bold">Microcontroller</text>
    <text x="318" y="112" font-size="9.9">7 firmware tasks:</text>
    <text x="318" y="128" font-size="9.9">sensor acquisition</text><text x="318" y="142" font-size="9.9">navigation</text>
    <text x="318" y="156" font-size="9.9">mission control</text><text x="318" y="170" font-size="9.9">actuator control</text>
    <text x="318" y="184" font-size="9.9">power manager</text><text x="318" y="198" font-size="9.9">app service</text>
    <text x="318" y="216" font-size="9.9" font-weight="bold" fill="#b91c1c">safety supervisor</text>
    <text x="316" y="371">Dock contacts</text><text x="440" y="371">Charger, 2 A</text>
    <text x="564" y="371">Battery 14.4 V</text><text x="685" y="365" font-size="9.9">Gauge and</text><text x="685" y="378" font-size="9.9">protection</text>
    <text x="564" y="429" font-size="9.9">Buck 5 V, sensors</text><text x="685" y="429" font-size="9.9">Buck 3.3 V, logic</text>
  </g>

  <!-- signal flows -->
  <g fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)">
    <path d="M 212 55 H 262"/><path d="M 212 93 H 262"/><path d="M 212 131 H 262"/><path d="M 212 169 H 262"/>
    <path d="M 212 253 H 238 V 196 H 262"/><path d="M 212 291 H 244 V 208 H 262"/>
    <path d="M 212 329 H 232 V 184 H 262"/><path d="M 212 367 H 226 V 222 H 262"/>
    <path d="M 372 67 H 386"/><path d="M 372 111 H 386"/>
    <path d="M 496 67 H 546"/><path d="M 496 111 H 546"/>
    <path d="M 372 160 H 520 V 171 H 546"/><path d="M 372 180 H 512 V 209 H 546"/>
    <path d="M 318 234 V 248"/><path d="M 356 234 V 242 H 442 V 248"/>
  </g>
  <g font-size="9.5" fill="#6b7280">
    <text x="236" y="51" text-anchor="middle" font-size="8.1">UART</text><text x="238" y="89" text-anchor="middle" font-size="8.6">I²C</text><text x="236" y="127" text-anchor="middle" font-size="8.1">GPIO</text>
    <text x="521" y="62" text-anchor="middle" font-size="8.6">3 phases</text><text x="446" y="156" text-anchor="middle" font-size="8.6">PWM</text>
  </g>
  <!-- hardware disable -->
  <path d="M 372 216 H 380 V 140 H 442 V 128" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#s)"/>
  <path d="M 442 140 H 470 V 84" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#s)"/>
  <path d="M 496 100 H 520 V 261 H 546" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#s)"/>

  <!-- power -->
  <g fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#p)">
    <path d="M 368 367 H 386"/><path d="M 492 367 H 510"/><path d="M 616 367 H 634"/>
    <path d="M 685 384 V 408"/><path d="M 660 396 H 564 V 408"/>
    <path d="M 720 350 V 306"/>
  </g>
  <path d="M 660 384 V 396" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="712" y="318" text-anchor="end" font-size="9.5" fill="#b45309">14.4 V to drivers and motors</text>

  <!-- legend -->
  <g font-size="10.3">
    <path d="M 264 462 h 26" stroke="#4b5563" stroke-width="1.2" marker-end="url(#a)"/><text x="298" y="466">signal or data</text>
    <path d="M 400 462 h 26" stroke="#b45309" stroke-width="1.5" marker-end="url(#p)"/><text x="434" y="466">power</text>
    <path d="M 496 462 h 26" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#s)"/><text x="530" y="466">safe-stop path (drive disable, then braking)</text>
  </g>
</svg>
