<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.7" fill="#1f2933">
  <!-- Authored figure. Budgets follow ModuleBudgets, design values the module attributes; scale 6 px per ms from x = 80. -->
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="20" y="72" font-weight="bold">Budget</text>
  <text x="20" y="152" font-weight="bold">Design</text>

  <!-- budget row: 25 / 10 / 5 / 50 / margin 10 -->
  <g stroke="#ffffff" stroke-width="1.5">
    <rect x="80" y="48" width="150" height="38" fill="#0891b2"/>
    <rect x="230" y="48" width="60" height="38" fill="#1d4ed8"/>
    <rect x="290" y="48" width="30" height="38" fill="#b45309"/>
    <rect x="320" y="48" width="300" height="38" fill="#4b5563"/>
    <rect x="620" y="48" width="60" height="38" fill="#e5e7eb" stroke="#9ca3af" stroke-dasharray="4 3"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-size="11.2">
    <text x="155" y="72">sensing 25 ms</text>
    <text x="260" y="72">10 ms</text>
    <text x="305" y="72">5</text>
    <text x="470" y="72">braking 50 ms</text>
  </g>
  <text x="650" y="72" text-anchor="middle" font-size="10.8" fill="#4b5563">margin</text>

  <!-- design row: 20 / 10 / 2 / 40 -->
  <g stroke="#ffffff" stroke-width="1.5">
    <rect x="80" y="128" width="120" height="38" fill="#0891b2" fill-opacity="0.75"/>
    <rect x="200" y="128" width="60" height="38" fill="#1d4ed8" fill-opacity="0.75"/>
    <rect x="260" y="128" width="12" height="38" fill="#b45309" fill-opacity="0.75"/>
    <rect x="272" y="128" width="240" height="38" fill="#4b5563" fill-opacity="0.75"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-size="11.2">
    <text x="140" y="152">20 ms</text>
    <text x="230" y="152">10 ms</text>
    <text x="392" y="152">40 ms</text>
  </g>
  <text x="520" y="152" font-size="10.8" fill="#4b5563">72 ms in total</text>

  <!-- axis -->
  <path d="M 80 190 h 600" stroke="#1f2933" stroke-width="1.2"/>
  <g stroke="#1f2933" stroke-width="1">
    <path d="M 80 186 v 8 M 200 186 v 8 M 320 186 v 8 M 440 186 v 8 M 560 186 v 8 M 680 186 v 8"/>
  </g>
  <g font-size="10.8" text-anchor="middle" fill="#4b5563">
    <text x="80" y="208">0</text><text x="200" y="208">20</text><text x="320" y="208">40</text>
    <text x="440" y="208">60</text><text x="560" y="208">80</text><text x="680" y="208">100 ms</text>
  </g>
  <path d="M 680 36 v 150" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="676" y="30" text-anchor="end" font-size="10.8" fill="#b91c1c">limit 100 ms (SYS-SAFE-011)</text>
  <path d="M 80 36 v 150" stroke="#1f2933" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="84" y="30" font-size="10.8">hazard appears</text>

  <!-- legend -->
  <g font-size="10.8">
    <rect x="80" y="232" width="12" height="12" fill="#0891b2"/><text x="98" y="243">Base module: cliff sensing (BASE-001)</text>
    <rect x="330" y="232" width="12" height="12" fill="#1d4ed8"/><text x="348" y="243">Firmware: safety supervisor (FW-001)</text>
    <rect x="80" y="250" width="12" height="12" fill="#b45309"/><text x="98" y="261">Main board: drive disable (PCB-001)</text>
    <rect x="330" y="250" width="12" height="12" fill="#4b5563"/><text x="348" y="261">Base module: braking to standstill (BASE-002)</text>
  </g>
</svg>
